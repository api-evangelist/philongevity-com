surface_relationship:
  note: Phi Longevity publishes two agent surfaces on one host. A2A — one skill (records consolidation and visit prep) at https://philongevity.com/a2a, advertising AP2/x402 pay-per-use. MCP — a 6-tool Streamable HTTP server at https://philongevity.com/mcp (plus a 4-tool directory build at /mcp-app and an npm stdio package), see mcp/philongevity-com-mcp.yml. There is no REST/OpenAPI contract; the MCP tool inputSchemas are the only machine-readable operation contracts the company publishes.
