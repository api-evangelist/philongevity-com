  host: philongevity.com
  note: Served from the apex with content-type application/json and a content-disposition naming agent-card.json. www.philongevity.com 308-redirects to the apex and resolves to the same body. The legacy /.well-known/agent.json 404s on both hosts. The A2A endpoint https://philongevity.com/a2a also returns the same card on GET. Ownership is not in question — the card's provider.url and every interface URL sit on philongevity.com, the same host that serves the MCP endpoint, llms.txt and the JWKS the card is signed against.
