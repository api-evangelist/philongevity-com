aid: philongevity-com
name: Phi Longevity
description: >-
  Phi Longevity is a US health-data intelligence company whose PRISM engine consolidates a person's lab
  reports, wearable data and clinical notes into one scored, guideline-cited health report, with condition
  tracks for type-2 diabetes, lupus, cancer survivorship and general wellness. Its public developer surface
  is agent-native rather than REST: an official MCP server (hosted Streamable HTTP endpoint plus an npm stdio
  package, six tools, no key required, synthetic or de-identified values only), a signed A2A 1.0 agent card
  with an AP2/x402 pay-per-use extension, an llms.txt, and a $4.99 USDC per-call paid report settled via
  x402 on Base. Real medical records are analyzed only inside the authenticated app under a Google Cloud
  HIPAA BAA — PHI never transits the agent surfaces.
