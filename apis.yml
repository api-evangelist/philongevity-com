apis:
- name: Phi Longevity PRISM MCP Server
  description: >-
    Official Model Context Protocol server for the PRISM biomarker-analysis engine. Hosted Streamable HTTP
    at https://philongevity.com/mcp (6 tools — analyze_biomarkers, list_supported_biomarkers, quick_check,
    get_methodology, sample_prism_report, full_prism_report — plus 4 resources and 1 prompt), a 4-tool
    directory build at /mcp-app, and an npm stdio package @phi-longevity/mcp-server. Anonymous; synthetic
    or de-identified values only; full_prism_report is paid per call ($4.99 USDC) via x402.
  image: https://philongevity.com/favicon.ico
  humanURL: https://philongevity.com/for-agents
  baseURL: https://philongevity.com/mcp
  tags: [MCP, Biomarkers, Lab Results, Health Data, x402]
