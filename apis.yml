  - type: Documentation
    url: https://philongevity.com/for-agents
  - type: Packages
    url: packages/philongevity-com-packages.yml
  - type: Components
    url: components/philongevity-com-components.yml
  - type: Sandbox
    url: sandbox/philongevity-com-sandbox.yml
  - type: Demo
    url: https://philongevity.com/demo/prism-mcp-demo.webm
    name: PRISM MCP server live protocol recording (69 s, MCP Inspector)
- name: Phi Longevity PRISM A2A Agent
  description: >-
    A2A 1.0 agent (JSON-RPC at https://philongevity.com/a2a) with one skill — chronic-disease records
    consolidation and visit prep — described by an ES256-signed agent card at /.well-known/agent-card.json.
    Unauthenticated by design; streaming and push notifications declared false and honoured; advertises
    the AP2 payments extension settled via x402.
  image: https://philongevity.com/favicon.ico
  humanURL: https://philongevity.com/for-agents
  baseURL: https://philongevity.com/a2a
  tags: [A2A, Agent Card, Health Data, Medical Records, Agent Payments]
  properties:
